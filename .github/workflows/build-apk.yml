name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Check the calculations (prices, battery model, data reading) before building.
      - name: Logic tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      # The signing key lives only in the repository secrets, never in the code.
      - name: Prepare signing key
        id: signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ] && [ -n "$SIGNING_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | tr -d ' \n\r' | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=energy\nkeyPassword=%s\n' \
              "$SIGNING_PASSWORD" "$SIGNING_PASSWORD" > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk EnergyIntelligence.apk
          else
            # No signing key yet: a test-signed build (still installs fine on the phone).
            ./gradlew assembleDebug assembleRelease --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk EnergyIntelligence.apk
          fi

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: EnergyIntelligence-apk
          path: EnergyIntelligence.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release create "v1.0.${{ github.run_number }}" EnergyIntelligence.apk \
            --title "Energy Intelligence Bulgaria 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
